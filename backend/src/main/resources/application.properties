spring.application.name=agileflow
server.port=${PORT:8080}

# SQLite (file persisted; foreign keys enforced per connection). Single connection avoids SQLITE_BUSY.
spring.datasource.url=jdbc:sqlite:${DB_PATH:agileflow.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Security (JWT_SECRET: >=32 chars. If empty, a random secret is generated once and stored in .agileflow-jwt-secret)
agileflow.jwt.secret=${JWT_SECRET:}
agileflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
agileflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Demo data
agileflow.seed-demo=${SEED_DEMO:true}
agileflow.demo-password=${DEMO_PASSWORD:Demo@1234}

# Background notification workflow
agileflow.notifications.scan-interval-ms=${NOTIFY_SCAN_INTERVAL_MS:60000}
agileflow.notifications.upcoming-days=${NOTIFY_UPCOMING_DAYS:2}
agileflow.notifications.max-retries=${NOTIFY_MAX_RETRIES:3}
agileflow.notifications.retry-backoff-seconds=${NOTIFY_RETRY_BACKOFF_SECONDS:30}

springdoc.swagger-ui.path=/swagger-ui.html
