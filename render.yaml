# Optional Render Blueprint (New > Blueprint). The manual steps in docs/deployment.md do the same thing.
services:
  - type: web
    name: agileflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # set to your frontend URL, e.g. https://agileflow-web.onrender.com
      # Paid plans only: persist SQLite on a disk (add a `disk:` block mounted at /data) and set DB_PATH=/data/agileflow.db
  - type: web
    name: agileflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false            # e.g. https://agileflow-api.onrender.com/api
    routes:
      - type: rewrite          # single-page-app routing (/projects, /kanban ...)
        source: /*
        destination: /index.html
